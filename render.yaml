services:
  - type: web
    name: fangzheng-ai-financial-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m pytest -q
    startCommand: >-
      streamlit run src/app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
